services:
  app:
    build: .
    container_name: timetrack_app
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mariadb:10.11
    container_name: timetrack_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-time_tracking}
      MYSQL_USER: ${DB_USERNAME:-app_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3308:3306"
    volumes:
      - timetrack_db_data:/var/lib/mysql
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: timetrack_phpmyadmin
    ports:
      - "8083:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db
    restart: unless-stopped

volumes:
  timetrack_db_data:
