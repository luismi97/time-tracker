<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    # El resto de carpetas del proyecto (app, config, database, resources, routes,
    # storage) nunca son servidas: DocumentRoot apunta solo a /public y aqui se
    # deniega explicitamente el acceso directo a archivos sensibles como defensa
    # adicional en profundidad.
    <Directory /var/www/html>
        <FilesMatch "\.(env|sql|md|ini|lock|json|sh)$">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
