; Configuracion de produccion para PHP.
memory_limit=256M
upload_max_filesize=20M
post_max_size=24M
max_execution_time=60
expose_php=Off

; Las sesiones usan el directorio temporal propio del contenedor (no el bind-mount
; del codigo) para evitar problemas de permisos entre distintos sistemas operativos.
session.gc_maxlifetime = 7200
session.cookie_httponly = 1

realpath_cache_size=4096K
realpath_cache_ttl=600
